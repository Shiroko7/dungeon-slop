<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><title>wall check</title>
<style>body{margin:0;background:#555}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
  // Dev-only: does the shaded inner face sit against the wall ink everywhere?
  // Renders the map bare — no doors, glyphs, labels or grid, since those put
  // dark ink on the floor — and counts two kinds of fault:
  //   gaps     pure floor touching pure ink: the face is missing there
  //   slivers  a light pixel with ink on one side and face on the other,
  //            within two pixels: a line of paper between wall and face
  import { renderStaticLayers } from "/renderer/canvas-renderer.ts";
  import { getTheme } from "/renderer/themes/theme-engine.ts";
  import { FeatureType } from "/engine/types.ts";
  import { generateDungeon } from "/engine/generate.ts";
  import { DEFAULT_CONFIG } from "/ai/schema.ts";

  const res = await fetch("/api/dungeons/6");
  const { dungeon } = await res.json();
  window.__saved = dungeon.geometry ?? dungeon;
  window.__d = window.__saved;
  window.useGenerated = (over) => {
    window.__d = generateDungeon({ ...DEFAULT_CONFIG, grid_width: 60, grid_height: 60, ...over });
    return window.__d.rooms.length;
  };
  window.useSaved = () => { window.__d = window.__saved; return window.__d.rooms.length; };

  const ALL = new Set(Object.values(FeatureType));
  function render(cell, bare) {
    const geo = window.__d;
    const cv = new OffscreenCanvas(geo.width * cell, geo.height * cell);
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    renderStaticLayers(ctx, geo, {
      cellSize: cell,
      theme: getTheme(geo.config?.motif ?? "Default"),
      showGrid: !bare,
      hiddenFeatureTypes: bare ? ALL : undefined,
      includeRoomLabels: !bare,
    });
    return { cv, ctx };
  }

  function scan(cell) {
    const { cv, ctx } = render(cell, true);
    const W = cv.width, H = cv.height;
    const d = ctx.getImageData(0, 0, W, H).data;
    const L = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++) L[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    const FLOOR = 236, INK = 90;   // parchment is ~241, wall ink ~51, face ~159
    const isInk = (j) => L[j] < INK;
    const isFace = (j) => L[j] >= 130 && L[j] <= 185;
    const gapList = [], sliverList = [];
    for (let y = 2; y < H - 2; y++) {
      for (let x = 2; x < W - 2; x++) {
        const i = y * W + x;
        const l = L[i];
        if (l >= FLOOR) {
          let touch = false;
          for (let dy = -1; dy <= 1 && !touch; dy++) {
            for (let dx = -1; dx <= 1; dx++) if (isInk(i + dy * W + dx)) { touch = true; break; }
          }
          if (touch) gapList.push([x, y]);
        }
        if (l >= 200) {
          for (const s of [1, W]) {
            const inkBefore = isInk(i - s) || isInk(i - 2 * s);
            const inkAfter = isInk(i + s) || isInk(i + 2 * s);
            const faceBefore = isFace(i - s) || isFace(i - 2 * s);
            const faceAfter = isFace(i + s) || isFace(i + 2 * s);
            if ((inkBefore && faceAfter) || (inkAfter && faceBefore)) { sliverList.push([x, y]); break; }
          }
        }
      }
    }
    return { cv, W, H, L, gapList, sliverList };
  }

  window.gaps = (cell) => {
    const { gapList, sliverList } = scan(cell);
    const cells = new Map();
    for (const [x, y] of [...gapList, ...sliverList]) {
      const k = `${Math.floor(x / cell)},${Math.floor(y / cell)}`;
      cells.set(k, (cells.get(k) ?? 0) + 1);
    }
    const worst = [...cells.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
    return { gaps: gapList.length, slivers: sliverList.length, cellsAffected: cells.size, worst };
  };

  /** Every remaining sliver pixel, with its luminance and its neighbours'. */
  window.sliverSpots = (cell, max = 60) => {
    const { W, L, sliverList } = scan(cell);
    return sliverList.slice(0, max).map(([x, y]) => {
      const row = [];
      for (let dx = -3; dx <= 3; dx++) row.push(Math.round(L[y * W + x + dx]));
      const col = [];
      for (let dy = -3; dy <= 3; dy++) col.push(Math.round(L[(y + dy) * W + x]));
      return { px: x, py: y, cx: +(x / cell).toFixed(2), cy: +(y / cell).toFixed(2), row, col };
    });
  };

  /** A magnified window of the bare render around one pixel, slivers marked. */
  window.markCrop = (px, py, cell, halfPx = 40, zoom = 8) => {
    const { cv, sliverList, gapList } = scan(cell);
    const x0 = Math.max(0, px - halfPx), y0 = Math.max(0, py - halfPx);
    const w = halfPx * 2, h = halfPx * 2;
    const c = document.getElementById("c");
    c.width = w * zoom; c.height = h * zoom;
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.drawImage(cv, x0, y0, w, h, 0, 0, w * zoom, h * zoom);
    g.strokeStyle = "#ff0000"; g.lineWidth = 2;
    for (const [x, y] of sliverList) {
      if (x < x0 || y < y0 || x >= x0 + w || y >= y0 + h) continue;
      g.strokeRect((x - x0) * zoom, (y - y0) * zoom, zoom, zoom);
    }
    g.strokeStyle = "#0077ff";
    for (const [x, y] of gapList) {
      if (x < x0 || y < y0 || x >= x0 + w || y >= y0 + h) continue;
      g.strokeRect((x - x0) * zoom, (y - y0) * zoom, zoom, zoom);
    }
  };

  /** Draw a region with everything on, for looking at. */
  window.crop = (x0, y0, x1, y1, cell) => {
    const { cv } = render(cell, false);
    const c = document.getElementById("c");
    c.width = (x1 - x0) * cell; c.height = (y1 - y0) * cell;
    c.getContext("2d").drawImage(cv, x0 * cell, y0 * cell, c.width, c.height, 0, 0, c.width, c.height);
    return { w: c.width, h: c.height };
  };
  window.room = (id) => { const r = window.__d.rooms.find((q) => q.id === id); return { x: r.x, y: r.y, w: r.width, h: r.height }; };
  window.__ready = true;
</script></body></html>
